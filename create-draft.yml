name: Create Horror Episode Draft

on:
  schedule:
    - cron: "0 20 * * *"   # كل يوم الساعة 10 مساءً بتوقيت القاهرة تقريبًا (عدّل حسب UTC)
  workflow_dispatch: {}     # يسمحلك تشغّله يدويًا من تاب Actions وقت ما تحب

permissions:
  contents: write
  issues: write

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Fetch real stock clips (Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate human-like voice (edge-tts)
        run: python scripts/generate_voice.py

      - name: Assemble final video (ffmpeg)
        run: python scripts/assemble_video.py

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-video
          path: output/final_video.mp4
          retention-days: 14

      - name: Open review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/open_review_issue.py

      - name: Commit updated clip-tracking state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json
          git commit -m "chore: update used clips tracking [skip ci]" || echo "لا يوجد تغيير"
          git push
